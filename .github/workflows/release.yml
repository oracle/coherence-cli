# ---------------------------------------------------------------------------
# Coherence CLI GitHub Actions Release build.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

# Serialize this repository/tag without interrupting a release already in progress.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release:
    name: build_release
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: 'go.mod'

    - name: Release CLI setup, preflight, staging and publication tests
      shell: bash
      run: make test-release-gh test-release-preflight test-release-staging test-release-publication

    - name: Set up pinned GitHub CLI
      id: release_gh
      shell: bash
      run: ./scripts/setup-release-gh.sh

    - name: Lint
      shell: bash
      run: make golangci

    - name: Copyright Check
      shell: bash
      run: make copyright

    - name: Installer integrity tests
      shell: bash
      run: make test-install test-checksums test-install-docs

    - name: Unit Tests
      shell: bash
      run: make test-cohctl && make cohctl

    - name: Set Version
      shell: bash
      run: |
        version=$(./bin/cohctl version | awk '/CLI Version:/ {print $3}')
        echo "version=${version}" >> "$GITHUB_OUTPUT"
      id: version

    - name: E2E Local Tests
      shell: bash
      run: COHERENCE_BASE_IMAGE=gcr.io/distroless/java17 COHERENCE_VERSION=14.1.2-0-5 make clean build-test-images test-e2e-standalone

    - name: Discovery Tests
      shell: bash
      run: make test-clean test-discovery

    - name: Build Docs
      shell: bash
      run: |
        make docs
        cd build/_output/docs
        zip -r ../docs.zip ./*

    - name: Build Binaries
      shell: bash
      run: |
        make cohctl-all

    - name: Generate SHA-256 checksums
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: ./scripts/generate-checksums.sh "$RELEASE_VERSION" ./bin ./build/_output/docs.zip "cohctl-${RELEASE_VERSION}-checksums.txt"

    - name: Stage and verify release assets
      id: release_assets
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: python3 ./scripts/stage-release-assets.py

    - name: Create, validate and publish release
      shell: bash
      env:
        RELEASE_GH: ${{ steps.release_gh.outputs.path }}
        RELEASE_ASSETS: ${{ steps.release_assets.outputs.path }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_REF: ${{ github.ref }}
        RELEASE_REF_TYPE: ${{ github.ref_type }}
        RELEASE_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      run: python3 ./scripts/publish-release.py

    - name: Verify public release downloads
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RELEASE_REPOSITORY: ${{ github.repository }}
      run: ./scripts/verify-release.sh "$RELEASE_VERSION" "cohctl-${RELEASE_VERSION}-checksums.txt"

    - name: Release GitHub Pages Stable.txt
      if: ${{ success() }}
      shell: bash
      run: |
        git config --local user.name "Github Action"
        git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
        make release-ghpages

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: test-output
        path: build/_output/test-logs
